<!DOCTYPE html>
<html class="light" lang="ko">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Nova AI - Dashboard</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#0058bc",
            "on-background": "#1a1c1d",
            "surface": "#f9f9fb",
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"
          },
          spacing: {
            "unit": "8px",
            "stack-lg": "24px",
            "stack-md": "12px",
            "stack-sm": "4px",
          },
          fontFamily: {
            body: ["Inter"]
          },
          fontSize: {
            h1: ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
            "body-md": ["15px", { lineHeight: "22px", letterSpacing: "0em", fontWeight: "400" }],
            "body-sm": ["13px", { lineHeight: "18px", letterSpacing: "0em", fontWeight: "400" }],
            caption: ["11px", { lineHeight: "14px", letterSpacing: "0.01em", fontWeight: "400" }],
          }
        },
      },
    }
  </script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      border-left: 1px solid rgba(255, 255, 255, 0.5);
      border-right: 1px solid rgba(0, 0, 0, 0.05);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }
    .ai-input-blur {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
    }
    body {
      background-color: #f9f9fb;
      background-image: 
        radial-gradient(at 0% 0%, rgba(173, 198, 255, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(116, 209, 255, 0.1) 0px, transparent 50%);
      min-height: 100vh;
    }
    .message-bubble {
      animation: slideIn 0.3s ease-out;
    }
    .message-bubble:hover .copy-btn {
      opacity: 1;
    }
    .copy-btn {
      opacity: 0;
      transition: opacity 0.2s ease-out;
    }
    .copy-btn:hover,
    .copy-btn:focus {
      opacity: 1;
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0, 88, 188, 0.3);
      border-radius: 50%;
      border-top-color: #0058bc;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="font-body-md text-on-background selection:bg-primary/20">
  <header class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-8 py-3 bg-white/60 dark:bg-slate-900/60 backdrop-blur-2xl border-b border-white/30 dark:border-slate-800/50">
    <div class="flex items-center gap-8">
      <span class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-500">Nova AI</span>
      <nav class="hidden md:flex items-center gap-6">
        <a class="font-sans text-sm font-medium tracking-tight text-blue-600 dark:text-blue-400 border-b-2 border-blue-600 dark:border-blue-400 pb-1" href="Dashboard.html">Dashboard</a>
        <a class="font-sans text-sm font-medium tracking-tight text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 transition-colors" href="workspace.html">Workspace</a>
      </nav>
    </div>
    <div class="flex items-center gap-4">
      <button class="p-2 hover:bg-white/40 dark:hover:bg-slate-800/40 rounded-lg transition-colors active:scale-[0.98]" onclick="location.href='setting.html'">
        <span class="material-symbols-outlined text-slate-600">settings</span>
      </button>
    </div>
  </header>

  <main class="pt-32 pb-20 px-8 max-w-4xl mx-auto">
    <!-- Chat Container -->
    <div class="glass-card rounded-3xl overflow-hidden flex flex-col" style="height: calc(100vh - 200px); min-height: 500px;">
      <!-- Messages Area -->
      <div class="flex-1 overflow-y-auto p-8 space-y-6" id="messages-container">
        <div class="text-center space-y-4 py-12">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-blue-100 to-indigo-100">
            <span class="material-symbols-outlined text-3xl text-primary" style="font-variation-settings: 'FILL' 1;">bolt</span>
          </div>
          <div>
            <h2 class="text-2xl font-bold text-on-background mb-2">무엇을 도와드릴까요?</h2>
            <p class="text-slate-500 max-w-sm">오늘의 업무를 Nova AI와 함께 시작하세요.</p>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="bg-white/20 border-t border-white/20 p-6">
        <div class="flex gap-3">
          <div class="flex-1 ai-input-blur rounded-full px-6 py-3 flex items-center border border-white/20">
            <input 
              type="text" 
              id="message-input"
              class="flex-1 bg-transparent border-none focus:outline-none text-on-background placeholder-slate-400" 
              placeholder="메시지를 입력하세요..." 
              onkeypress="handleKeyPress(event)"
            />
            <span class="material-symbols-outlined text-slate-400 text-xl cursor-pointer hover:text-slate-600 transition-colors" onclick="attachFile()">attach_file</span>
          </div>
          <button 
            class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center hover:opacity-90 active:scale-95 transition-all shadow-lg"
            onclick="sendMessage()"
          >
            <span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">arrow_upward</span>
          </button>
        </div>
        <div class="mt-3 flex items-center gap-2 text-xs text-slate-500">
          <span class="material-symbols-outlined text-sm">info</span>
          <span id="model-status">모델: 로드 중...</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    const messageContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const modelStatus = document.getElementById('model-status');
    
    let currentModel = 'openai';
    let settings = null;

    // 초기화
    async function initialize() {
      try {
        settings = await window.electron.invoke('load-settings');
        currentModel = settings.defaultModel || 'openai';
        updateModelStatus();
        setupClipboardHandlers();
      } catch (error) {
        console.error('초기화 실패:', error);
        modelStatus.textContent = '오류: 설정을 로드할 수 없습니다';
      }
    }

    function setupClipboardHandlers() {
      // 기본 브라우저 클립보드 동작을 그대로 사용합니다.
      // Electron preload에서 노출한 clipboard API는 복사 버튼과 IPC용으로만 사용합니다.
    }

    function updateModelStatus() {
      if (!settings) return;
      
      const modelMap = {
        'openai': 'GPT-4o',
        'anthropic': 'Claude 3.5 Sonnet',
        'google': 'Gemini 2.0 Flash'
      };
      
      const modelName = modelMap[currentModel] || '기본 모델';
      modelStatus.textContent = `모델: ${modelName}`;
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const message = messageInput.value.trim();
      if (!message) return;

      // 사용자 메시지 표시
      displayMessage(message, 'user');
      messageInput.value = '';

      // 로딩 표시
      displayLoading();

      try {
        if (!currentModel) {
          displayMessage('오류: 기본 모델이 설정되지 않았습니다. 설정에서 모델을 선택해주세요.', 'error');
          return;
        }

        // AI 응답 받기
        const result = await window.electron.invoke('send-message', {
          message: message,
          model: currentModel
        });

        // 로딩 제거
        removeLoading();

        if (result.error) {
          displayMessage(`오류: ${result.error}`, 'error');
        } else if (result.response) {
          displayMessage(result.response, 'assistant');
        }
      } catch (error) {
        removeLoading();
        console.error('메시지 전송 실패:', error);
        displayMessage(`오류: ${error.message}`, 'error');
      }
    }

    function displayMessage(text, role) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message-bubble flex ${role === 'user' ? 'justify-end' : 'justify-start'} gap-2 items-end`;

      const contentDiv = document.createElement('div');
      contentDiv.className = `max-w-md ${role === 'user' ? 'bg-primary text-white' : role === 'error' ? 'bg-red-100 text-red-800' : 'bg-slate-100 text-on-background'} rounded-2xl px-4 py-3 text-sm break-words`;
      
      contentDiv.textContent = text;
      messageDiv.appendChild(contentDiv);

      // 어시스턴트와 에러 메시지에만 복사 버튼 추가
      if (role === 'assistant' || role === 'error') {
        const copyButton = document.createElement('button');
        copyButton.className = 'copy-btn p-2 hover:bg-slate-200 dark:hover:bg-slate-700 rounded transition-all focus:outline-none focus:ring-2 focus:ring-primary/50';
        copyButton.title = '복사';
        copyButton.innerHTML = '<span class="material-symbols-outlined text-sm">content_copy</span>';
        copyButton.onclick = async () => {
          try {
            await window.electron.invoke('clipboard-write-text', text);
            const originalContent = copyButton.innerHTML;
            copyButton.innerHTML = '<span class="material-symbols-outlined text-sm text-green-600">done</span>';
            setTimeout(() => {
              copyButton.innerHTML = originalContent;
            }, 2000);
          } catch (error) {
            console.error('복사 실패:', error);
          }
        };
        messageDiv.appendChild(copyButton);
      }

      messageContainer.appendChild(messageDiv);
      messageContainer.scrollTop = messageContainer.scrollHeight;
    }

    function displayLoading() {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message-bubble flex justify-start';
      messageDiv.id = 'loading-message';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'bg-slate-100 text-on-background rounded-2xl px-4 py-3 flex items-center gap-2';
      
      const spinner = document.createElement('div');
      spinner.className = 'loading-spinner';
      
      const text = document.createElement('span');
      text.textContent = '응답 생성 중...';
      
      contentDiv.appendChild(spinner);
      contentDiv.appendChild(text);
      messageDiv.appendChild(contentDiv);
      messageContainer.appendChild(messageDiv);
      messageContainer.scrollTop = messageContainer.scrollHeight;
    }

    function removeLoading() {
      const loadingMessage = document.getElementById('loading-message');
      if (loadingMessage) {
        loadingMessage.remove();
      }
    }

    function attachFile() {
      // 파일 첨부 기능은 나중에 구현
      alert('파일 첨부 기능은 개발 중입니다.');
    }

    // 초기화 실행
    window.addEventListener('DOMContentLoaded', initialize);
  </script>
</body>
</html>
